name: Biweekly digest → Matters draft (全站熱門 + 頻道置頂)

on:
  schedule:
    # Two attempts each Monday, off-peak minutes (GitHub delays/drops :00 runs).
    # The compose step gates to the 1st & 3rd Monday; a publish marker makes the
    # 2nd attempt a no-op if the 1st already posted (at most one draft per cycle).
    - cron: "37 1 * * 1"   # 01:37 UTC = 09:37 HKT (primary)
    - cron: "37 4 * * 1"   # 04:37 UTC = 12:37 HKT (backup, if primary dropped)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (compose only, don't create the draft)"
        required: false
        default: "false"

# Folds today's pins into the accumulated state and commits it back.
permissions:
  contents: write

env:
  STATE_FILE: state/channel_pins.json

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Compose biweekly digest draft
        env:
          # Dedicated newsletter account — add these two repo secrets.
          MATTERS_EMAIL: ${{ secrets.DIGEST_MATTERS_EMAIL }}
          MATTERS_PASSWORD: ${{ secrets.DIGEST_MATTERS_PASSWORD }}
        run: |
          # Publish only on the 1st & 3rd Monday (UTC day-of-month 1–7 or 15–21).
          # Manual (workflow_dispatch) runs are never gated.
          DOM=$(date -u +%-d)
          if [ "${{ github.event_name }}" = "schedule" ] && \
             ! { { [ "$DOM" -ge 1 ] && [ "$DOM" -le 7 ]; } || { [ "$DOM" -ge 15 ] && [ "$DOM" -le 21 ]; }; }; then
            echo "Scheduled run but not the 1st/3rd Monday (UTC day=$DOM) — skipping."
            exit 0
          fi
          ARGS="--type biweekly --state $STATE_FILE"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m bot.digest $ARGS

      - name: Commit updated pin state
        run: |
          git add "$STATE_FILE" state/last_published.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "state unchanged"; exit 0
          fi
          git config user.name "newsletter-bot"
          git config user.email "newsletter-bot@users.noreply.github.com"
          git commit -m "chore: biweekly state ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for attempt in 1 2 3; do
            if git push; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push attempt $attempt rejected; rebasing"
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "push failed after 3 attempts"; exit 1
