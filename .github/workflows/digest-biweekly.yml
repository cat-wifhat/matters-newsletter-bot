name: Biweekly digest → Matters draft (全站熱門 + 頻道置頂)

on:
  schedule:
    # Two attempts each Wednesday afternoon (spaced from the weekly's morning slots
    # so both can land on the same "biweekly Wednesday" without colliding).
    # The compose step gates to every-other Wednesday (14-day cadence from 2026-07-08);
    # a publish marker makes the 2nd attempt a no-op if the 1st already posted.
    - cron: "37 5 * * 3"   # 05:37 UTC = 13:37 HKT (primary)
    - cron: "37 8 * * 3"   # 08:37 UTC = 16:37 HKT (backup, if primary dropped)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (compose only, don't create the draft)"
        required: false
        default: "false"
      publish:
        description: "Publish (public). Set false for a draft-only manual run."
        required: false
        default: "true"

# Folds today's pins into the accumulated state and commits it back.
permissions:
  contents: write

env:
  STATE_FILE: state/channel_pins.json

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Compose biweekly digest draft
        env:
          # Dedicated newsletter account — add these two repo secrets.
          MATTERS_EMAIL: ${{ secrets.DIGEST_MATTERS_EMAIL }}
          MATTERS_PASSWORD: ${{ secrets.DIGEST_MATTERS_PASSWORD }}
        run: |
          # Publish only every OTHER Wednesday — 14-day cadence anchored on the last
          # biweekly (2026-07-08): next are 07-22, 08-05, 08-19, … The cron fires every
          # Wednesday; this gate skips the in-between ones. Manual runs are never gated.
          ANCHOR="2026-07-08"
          DAYS=$(( ( $(date -u -d "$(date -u +%F)" +%s) - $(date -u -d "$ANCHOR" +%s) ) / 86400 ))
          if [ "${{ github.event_name }}" = "schedule" ] && [ $(( DAYS % 14 )) -ne 0 ]; then
            echo "Not a biweekly Wednesday (days since $ANCHOR = $DAYS) — skipping."
            exit 0
          fi
          ARGS="--type biweekly --state $STATE_FILE"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          elif [ "${{ github.event.inputs.publish }}" != "false" ]; then
            ARGS="$ARGS --publish"   # 自動發佈（公開）；手動觸發設 publish=false 可只存草稿
          fi
          # 手動觸發＝刻意重推，繞過當日防重複；排程（主/備）不帶 --force 仍防重複。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARGS="$ARGS --force"; fi
          python -m bot.digest $ARGS

      - name: Commit updated pin state
        run: |
          git add "$STATE_FILE" state/published-biweekly.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "state unchanged"; exit 0
          fi
          git config user.name "newsletter-bot"
          git config user.email "newsletter-bot@users.noreply.github.com"
          git commit -m "chore: biweekly state ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for attempt in 1 2 3; do
            if git push; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push attempt $attempt rejected; rebasing"
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "push failed after 3 attempts"; exit 1
