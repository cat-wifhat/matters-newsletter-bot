name: Weekly digest → Matters draft (一周熱門)

on:
  schedule:
    # Two attempts each Wednesday, off-peak minutes (GitHub delays/drops :00 runs).
    # A publish marker (state/last_published.json) makes the 2nd a no-op if the
    # 1st already posted — so at most one draft per week.
    - cron: "37 1 * * 3"   # 01:37 UTC = 09:37 HKT (primary)
    - cron: "37 4 * * 3"   # 04:37 UTC = 12:37 HKT (backup, if primary dropped)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (compose only, don't create the draft)"
        required: false
        default: "false"

# Commits the publish marker (state/last_published.json) back to the repo.
permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Compose weekly digest draft
        env:
          # Dedicated newsletter account — add these two repo secrets.
          MATTERS_EMAIL: ${{ secrets.DIGEST_MATTERS_EMAIL }}
          MATTERS_PASSWORD: ${{ secrets.DIGEST_MATTERS_PASSWORD }}
        run: |
          ARGS="--type weekly"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m bot.digest $ARGS

      - name: Commit publish marker
        run: |
          git add state/last_published.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "marker unchanged"; exit 0; fi
          git config user.name "newsletter-bot"
          git config user.email "newsletter-bot@users.noreply.github.com"
          git commit -m "chore: weekly publish marker ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for attempt in 1 2 3; do
            if git push; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push attempt $attempt rejected; rebasing"
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "push failed after 3 attempts"; exit 1
