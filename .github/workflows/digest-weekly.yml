name: Weekly digest → Matters draft (一周熱門)

on:
  schedule:
    # Three attempts each Wednesday morning, 1h apart (GitHub often drops scheduled
    # runs; the publish marker state/published-weekly.json makes every attempt after
    # the first success a no-op — so at most one post/week, out by ~11:37 HKT latest).
    - cron: "37 1 * * 3"   # 01:37 UTC = 09:37 HKT
    - cron: "37 2 * * 3"   # 02:37 UTC = 10:37 HKT
    - cron: "37 3 * * 3"   # 03:37 UTC = 11:37 HKT
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (compose only, don't create the draft)"
        required: false
        default: "false"
      publish:
        description: "Publish (public). Set false for a draft-only manual run."
        required: false
        default: "true"

# Commits the publish marker (state/published-weekly.json) back to the repo.
permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Compose weekly digest draft
        env:
          # Dedicated newsletter account — add these two repo secrets.
          MATTERS_EMAIL: ${{ secrets.DIGEST_MATTERS_EMAIL }}
          MATTERS_PASSWORD: ${{ secrets.DIGEST_MATTERS_PASSWORD }}
        run: |
          ARGS="--type weekly"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          elif [ "${{ github.event.inputs.publish }}" != "false" ]; then
            ARGS="$ARGS --publish"   # 自動發佈（公開）；手動觸發設 publish=false 可只存草稿
          fi
          # 手動觸發＝刻意重推，繞過當日防重複；排程（主/備）不帶 --force 仍防重複。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARGS="$ARGS --force"; fi
          python -m bot.digest $ARGS

      - name: Commit publish marker
        run: |
          git add state/published-weekly.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "marker unchanged"; exit 0; fi
          git config user.name "newsletter-bot"
          git config user.email "newsletter-bot@users.noreply.github.com"
          git commit -m "chore: weekly publish marker ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for attempt in 1 2 3; do
            if git push; then echo "pushed on attempt $attempt"; exit 0; fi
            echo "push attempt $attempt rejected; rebasing"
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "push failed after 3 attempts"; exit 1
